[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscalpoint-ml"
version = "2.0.0"
description = "Machine-learning models and inference API for the FiscalPoint personal finance app"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "flask>=3.0",
    "mysql-connector-python>=8.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fiscalpoint-train = "fiscalpoint_ml.train:main"
fiscalpoint-api = "fiscalpoint_ml.api:main"

[tool.setuptools.packages.find]
include = ["fiscalpoint_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
